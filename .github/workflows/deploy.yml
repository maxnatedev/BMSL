name: Deploy

on:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP Lint
        run: find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \;
      - name: Validate HTML
        continue-on-error: true
        run: |
          sudo apt-get install -y html5validator 2>/dev/null || true
          find . -name "*.php" -exec html5validator {} \; 2>/dev/null || true

  deploy:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: /public_html/
          exclude: |
            .git/
            .gitignore
            .env
            README.md
            .github/
            uploads/
